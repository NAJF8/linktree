<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>101 COFFEE HOUSE</title>
    <!-- Google Fonts: Cairo & Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #6d866a;       /* اللون الأخضر الزيتي الأساسي من الصورة */
            --card-bg: #577054;        /* لون كروت الروابط الأغمق */
            --card-hover: #4a6148;     /* لون الكرت عند الضغط/التحويم */
            --thumb-bg: #445941;       /* خلفية أيقونة/صورة الكرت */
            --text-color: #ffffff;      /* لون النصوص الأساسي */
            --accent-green: #90c290;   /* أخضر فاتح للتفاصيل */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0 0 50px 0;
        }

        /* حاوية التصميم - قياس مخصص للموبايل والويب */
        .page-wrapper {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* منطقة الفيديو / الغلاف العلوي */
        .header-cover {
            width: 100%;
            height: 220px;
            position: relative;
            background-color: #1a2219;
            overflow: hidden;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .header-cover video,
        .header-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* طبقة تدرج ناعمة فوق الفيديو */
        .header-cover::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(109, 134, 106, 0.6), transparent);
            pointer-events: none;
        }

        /* صورة اللوجو الدائرية المتداخلة */
        .profile-container {
            position: relative;
            margin-top: -55px;
            z-index: 10;
        }

        .profile-logo {
            width: 106px;
            height: 106px;
            border-radius: 50%;
            border: 4px solid var(--bg-color);
            background-color: #577054;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.22);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* الاسم والوصف */
        .profile-title {
            margin-top: 14px;
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .profile-subtitle {
            font-size: 0.95rem;
            opacity: 0.88;
            margin-top: 3px;
            font-weight: 500;
        }

        /* أيقونات التواصل الاجتماعي الدائرية العلوية */
        .social-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 18px;
            margin-bottom: 24px;
        }

        .social-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.4rem;
            text-decoration: none;
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .social-btn:hover, .social-btn:active {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.25);
        }

        /* قائمة روابط البطاقات */
        .links-list {
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 12px 14px;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.22s ease;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }

        .link-card:hover {
            background-color: var(--card-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.16);
        }

        .link-card:active {
            transform: scale(0.98);
        }

        /* الأيقونة / الصورة المصغرة في يمين الكرت */
        .card-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background-color: var(--thumb-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.45rem;
            color: #ffffff;
            margin-left: 14px;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .card-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* النصوص والتفاصيل */
        .card-info {
            flex-grow: 1;
            text-align: right;
            overflow: hidden;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-subtitle {
            font-size: 0.8rem;
            opacity: 0.82;
            margin-top: 3px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* النقاط الجانبية الثلاث */
        .card-dots {
            opacity: 0.5;
            font-size: 1.1rem;
            padding-right: 6px;
            padding-left: 4px;
            display: flex;
            align-items: center;
        }

        /* تذييل الصفحة الأنيق */
        .footer {
            margin-top: 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            opacity: 0.75;
            font-size: 0.85rem;
        }

        .footer span {
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <!-- 1. غلاف الفيديو بالأعلى (ضع مقطعك باسم video.mp4 أو غيّر الرابط) -->
        <div class="header-cover">
            <video autoplay muted loop playsinline poster="logo.png">
                <source src="video.mp4" type="video/mp4">
            </video>
        </div>

        <!-- 2. صورة اللوجو الدائرية -->
        <div class="profile-container">
            <div class="profile-logo">
                <img src="logo.png" alt="101 Coffee Logo" onerror="this.src='https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=200&auto=format&fit=crop&q=80'">
            </div>
        </div>

        <!-- 3. العنوان والمعرف -->
        <h1 class="profile-title">@101COFFEE</h1>
        <p class="profile-subtitle">101 COFFEE HOUSE • النجف الأشرف</p>

        <!-- 4. الأيقونات الدائرية السريعة (انستغرام + موقع + واتساب) -->
        <div class="social-buttons">
            <a href="https://www.instagram.com/101co_ffee?stkn=MTZmaTdiZWVwNTNpcQ==" target="_blank" class="social-btn" title="انستغرام">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://maps.app.goo.gl/2KTJ82HrDf9bb6YZA?g_st=ic" target="_blank" class="social-btn" title="موقعنا على الخريطة">
                <i class="fa-solid fa-location-dot"></i>
            </a>
            <a href="https://101coffees.com" target="_blank" class="social-btn" title="المنيو الإلكتروني">
                <i class="fa-solid fa-mug-hot"></i>
            </a>
        </div>

        <!-- 5. كروت الروابط الرئيسية -->
        <div class="links-list">

            <!-- رابط المنيو الإلكتروني -->
            <a href="https://101coffees.com" target="_blank" class="link-card">
                <div class="card-icon" style="background: #3e533b;">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <div class="card-info">
                    <div class="card-title">101 COFFEE — منيو إلكتروني</div>
                    <div class="card-subtitle">
                        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 0.7rem;"></i> تصفح قائمة المشروبات والحلويات
                    </div>
                </div>
                <div class="card-dots"><i class="fa-solid fa-ellipsis-vertical"></i></div>
            </a>

            <!-- رابط الموقع الجغرافي (Google Maps) -->
            <a href="https://maps.app.goo.gl/2KTJ82HrDf9bb6YZA?g_st=ic" target="_blank" class="link-card">
                <div class="card-icon" style="background: #3a5449;">
                    <i class="fa-solid fa-map-location-dot"></i>
                </div>
                <div class="card-info">
                    <div class="card-title">موقع الكافيه (Google Maps)</div>
                    <div class="card-subtitle">
                        <i class="fa-solid fa-location-pin" style="font-size: 0.75rem; color: #ff8e8e;"></i> النجف الأشرف — اضغط للاتجاهات
                    </div>
                </div>
                <div class="card-dots"><i class="fa-solid fa-ellipsis-vertical"></i></div>
            </a>

            <!-- رابط حساب الإنستغرام -->
            <a href="https://www.instagram.com/101co_ffee?stkn=MTZmaTdiZWVwNTNpcQ==" target="_blank" class="link-card">
                <div class="card-icon" style="background: #503d46;">
                    <i class="fa-brands fa-instagram"></i>
                </div>
                <div class="card-info">
                    <div class="card-title">101coffee house (@101co_ffee)</div>
                    <div class="card-subtitle">
                        <i class="fa-regular fa-images" style="font-size: 0.75rem;"></i> تابع يومياتنا وجديدنا على انستغرام
                    </div>
                </div>
                <div class="card-dots"><i class="fa-solid fa-ellipsis-vertical"></i></div>
            </a>

        </div>

        <!-- تذييل -->
        <div class="footer">
            <span>101 COFFEE HOUSE</span>
        </div>
    </div>

</body>
</html>
